<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Distance Tracker</title>
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
  <style>
    *, *::before, *::after {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: "Times New Roman", Times, serif;
      background: #000;
      color: #fff;
      height: 100vh;
      display: flex;
      overflow: hidden;
    }

    /* Sidebar */
    .sidebar {
      width: 380px;
      min-width: 380px;
      background: #000;
      border-right: 1px solid #333;
      display: flex;
      flex-direction: column;
      height: 100vh;
      overflow-y: auto;
    }

    .sidebar-header {
      padding: 28px 24px 20px;
      border-bottom: 1px solid #333;
    }

    .sidebar-header h1 {
      font-family: "Times New Roman", Times, serif;
      font-size: 26px;
      font-weight: 700;
      letter-spacing: 1px;
      text-transform: uppercase;
      margin-bottom: 4px;
    }

    .sidebar-header p {
      font-family: "Times New Roman", Times, serif;
      font-size: 13px;
      color: #888;
      font-style: italic;
    }

    .section {
      padding: 20px 24px;
      border-bottom: 1px solid #333;
    }

    .section-label {
      font-family: "Times New Roman", Times, serif;
      font-size: 11px;
      text-transform: uppercase;
      letter-spacing: 2px;
      color: #888;
      margin-bottom: 12px;
    }

    .input-group {
      position: relative;
      margin-bottom: 12px;
    }

    input[type="text"] {
      font-family: "Times New Roman", Times, serif;
      width: 100%;
      padding: 10px 12px;
      background: #111;
      border: 1px solid #333;
      color: #fff;
      font-size: 14px;
      outline: none;
      transition: border-color 0.2s;
    }

    input[type="text"]:focus {
      border-color: #666;
    }

    input[type="text"]::placeholder {
      color: #555;
      font-style: italic;
    }

    button {
      font-family: "Times New Roman", Times, serif;
      cursor: pointer;
      font-size: 13px;
      text-transform: uppercase;
      letter-spacing: 1px;
      transition: all 0.2s;
    }

    .btn-primary {
      width: 100%;
      padding: 10px;
      background: #fff;
      color: #000;
      border: 1px solid #fff;
      font-weight: 700;
    }

    .btn-primary:hover {
      background: #ddd;
      border-color: #ddd;
    }

    .btn-primary:disabled {
      background: #333;
      border-color: #333;
      color: #666;
      cursor: not-allowed;
    }

    .btn-small {
      padding: 4px 10px;
      background: transparent;
      color: #888;
      border: 1px solid #444;
      font-size: 11px;
    }

    .btn-small:hover {
      color: #fff;
      border-color: #888;
    }

    .btn-danger {
      color: #999;
      border-color: #444;
    }

    .btn-danger:hover {
      color: #fff;
      border-color: #fff;
    }

    /* Autocomplete dropdown */
    .autocomplete-list {
      position: absolute;
      top: 100%;
      left: 0;
      right: 0;
      background: #111;
      border: 1px solid #333;
      border-top: none;
      z-index: 1000;
      max-height: 200px;
      overflow-y: auto;
    }

    .autocomplete-item {
      padding: 10px 12px;
      font-family: "Times New Roman", Times, serif;
      font-size: 13px;
      color: #ccc;
      cursor: pointer;
      border-bottom: 1px solid #222;
    }

    .autocomplete-item:last-child {
      border-bottom: none;
    }

    .autocomplete-item:hover {
      background: #222;
      color: #fff;
    }

    /* Your location card */
    .your-location-card {
      background: #111;
      border: 1px solid #333;
      padding: 16px;
      margin-top: 8px;
    }

    .your-location-card .card-header {
      display: flex;
      justify-content: space-between;
      align-items: flex-start;
      margin-bottom: 8px;
    }

    .your-location-card .card-name {
      font-family: "Times New Roman", Times, serif;
      font-size: 16px;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 1px;
    }

    .your-location-card .card-address {
      font-family: "Times New Roman", Times, serif;
      font-size: 12px;
      color: #888;
      line-height: 1.4;
      margin-bottom: 10px;
    }

    .your-location-card .card-distance {
      font-family: "Times New Roman", Times, serif;
      font-size: 22px;
      font-weight: 700;
      letter-spacing: 1px;
    }

    .your-location-card .card-distance-label {
      font-family: "Times New Roman", Times, serif;
      font-size: 11px;
      color: #888;
      text-transform: uppercase;
      letter-spacing: 2px;
    }

    /* Home status */
    .home-status {
      display: flex;
      align-items: center;
      gap: 8px;
      margin-top: 8px;
      font-size: 13px;
      color: #888;
    }

    .home-status .dot {
      width: 8px;
      height: 8px;
      border-radius: 50%;
      background: #555;
    }

    .home-status .dot.active {
      background: #fff;
    }

    .home-actions {
      display: flex;
      gap: 8px;
      margin-top: 10px;
    }

    /* Empty state */
    .empty-state {
      padding: 30px 24px;
      text-align: center;
      color: #555;
      font-style: italic;
      font-size: 14px;
    }

    /* Journey section */
    .journey-stats {
      margin-bottom: 16px;
    }

    .journey-stat-row {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 6px 0;
      font-size: 13px;
      color: #ccc;
    }

    .journey-stat-row .stat-label {
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .journey-stat-row .stat-value {
      font-weight: 700;
      color: #fff;
      font-size: 14px;
    }

    .stat-dot {
      width: 10px;
      height: 10px;
      border-radius: 50%;
      display: inline-block;
    }

    .stat-dot.road {
      background: #D4A843;
    }

    .stat-dot.ship {
      background: #64B5F6;
    }

    .stat-dot.total {
      background: #fff;
    }

    .journey-progress {
      margin-bottom: 16px;
    }

    .progress-bar {
      width: 100%;
      height: 4px;
      background: #222;
      margin-bottom: 10px;
      overflow: hidden;
    }

    .progress-fill {
      height: 100%;
      width: 0%;
      background: linear-gradient(90deg, #D4A843, #64B5F6);
      transition: width 0.1s linear;
    }

    .segment-indicator {
      font-size: 12px;
      color: #888;
      text-transform: uppercase;
      letter-spacing: 2px;
      text-align: center;
    }

    .segment-indicator.road {
      color: #D4A843;
    }

    .segment-indicator.ship {
      color: #64B5F6;
    }

    .journey-complete-msg {
      text-align: center;
      padding: 12px;
      background: #111;
      border: 1px solid #333;
      margin-bottom: 16px;
      font-size: 13px;
      color: #D4A843;
      text-transform: uppercase;
      letter-spacing: 2px;
    }

    .btn-journey {
      width: 100%;
      padding: 10px;
      background: #D4A843;
      color: #000;
      border: 1px solid #D4A843;
      font-weight: 700;
    }

    .btn-journey:hover {
      background: #c4983a;
      border-color: #c4983a;
    }

    .btn-journey:disabled {
      background: #333;
      border-color: #333;
      color: #666;
      cursor: not-allowed;
    }

    .btn-reset {
      width: 100%;
      padding: 8px;
      background: transparent;
      color: #888;
      border: 1px solid #444;
      font-weight: 400;
      margin-top: 8px;
    }

    .btn-reset:hover {
      color: #fff;
      border-color: #888;
    }

    /* Map container */
    .map-container {
      flex: 1;
      position: relative;
    }

    #map {
      width: 100%;
      height: 100%;
    }

    /* Map legend */
    .map-legend {
      position: absolute;
      bottom: 30px;
      left: 16px;
      background: rgba(0, 0, 0, 0.85);
      border: 1px solid #444;
      padding: 12px 16px;
      z-index: 1000;
      font-family: "Times New Roman", Times, serif;
    }

    .legend-title {
      font-size: 10px;
      text-transform: uppercase;
      letter-spacing: 2px;
      color: #888;
      margin-bottom: 8px;
    }

    .legend-item {
      display: flex;
      align-items: center;
      gap: 10px;
      margin-bottom: 5px;
      font-size: 12px;
      color: #ccc;
    }

    .legend-item:last-child {
      margin-bottom: 0;
    }

    .legend-line {
      width: 24px;
      height: 3px;
      display: inline-block;
    }

    .legend-line.road {
      background: #D4A843;
    }

    .legend-line.ship {
      background: #64B5F6;
      background: repeating-linear-gradient(
        90deg,
        #64B5F6 0px,
        #64B5F6 6px,
        transparent 6px,
        transparent 10px
      );
    }

    .legend-line.port-line {
      width: 10px;
      height: 10px;
      background: none;
      border: 2px solid #fff;
      border-radius: 50%;
    }

    /* Vehicle marker */
    .vehicle-dot {
      width: 18px;
      height: 18px;
      border-radius: 50%;
      border: 2px solid #000;
      animation: vehiclePulse 1.2s ease-in-out infinite;
      position: relative;
    }

    .vehicle-dot.road {
      background: #D4A843;
      box-shadow: 0 0 12px rgba(212, 168, 67, 0.6);
    }

    .vehicle-dot.ship {
      background: #64B5F6;
      box-shadow: 0 0 12px rgba(100, 181, 246, 0.6);
    }

    @keyframes vehiclePulse {
      0%, 100% { transform: scale(1); }
      50% { transform: scale(1.3); }
    }

    /* Port marker */
    .port-dot {
      width: 12px;
      height: 12px;
      border-radius: 50%;
      border: 2px solid #fff;
      background: #000;
    }

    /* Destination arrival pulse */
    .arrival-ring {
      width: 40px;
      height: 40px;
      border-radius: 50%;
      border: 2px solid #D4A843;
      position: absolute;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      animation: arrivalPulse 1.5s ease-out infinite;
    }

    @keyframes arrivalPulse {
      0% { transform: translate(-50%, -50%) scale(0.5); opacity: 1; }
      100% { transform: translate(-50%, -50%) scale(2.5); opacity: 0; }
    }

    /* Grayscale map tiles */
    .leaflet-tile-pane {
      filter: grayscale(100%) contrast(1.1) brightness(0.9);
    }

    /* Override Leaflet popup styles */
    .leaflet-popup-content-wrapper {
      font-family: "Times New Roman", Times, serif;
      background: #000;
      color: #fff;
      border: 1px solid #444;
      border-radius: 0;
      box-shadow: 0 2px 12px rgba(0,0,0,0.5);
    }

    .leaflet-popup-tip {
      background: #000;
      border: 1px solid #444;
      box-shadow: none;
    }

    .leaflet-popup-content {
      margin: 12px 16px;
      font-size: 13px;
      line-height: 1.5;
    }

    .popup-title {
      font-weight: 700;
      font-size: 14px;
      text-transform: uppercase;
      letter-spacing: 1px;
      margin-bottom: 4px;
    }

    .popup-address {
      color: #999;
      font-size: 12px;
      margin-bottom: 6px;
    }

    .popup-distance {
      font-size: 16px;
      font-weight: 700;
    }

    .leaflet-popup-close-button {
      color: #888 !important;
      font-family: "Times New Roman", Times, serif;
    }

    .leaflet-popup-close-button:hover {
      color: #fff !important;
    }

    /* Attribution styling */
    .leaflet-control-attribution {
      font-family: "Times New Roman", Times, serif !important;
      background: rgba(0,0,0,0.7) !important;
      color: #888 !important;
      font-size: 10px !important;
    }

    .leaflet-control-attribution a {
      color: #aaa !important;
    }

    /* Zoom control styling */
    .leaflet-control-zoom a {
      background: #000 !important;
      color: #fff !important;
      border: 1px solid #444 !important;
      font-family: "Times New Roman", Times, serif !important;
    }

    .leaflet-control-zoom a:hover {
      background: #222 !important;
    }

    /* Scrollbar styling */
    .sidebar::-webkit-scrollbar {
      width: 6px;
    }

    .sidebar::-webkit-scrollbar-track {
      background: #000;
    }

    .sidebar::-webkit-scrollbar-thumb {
      background: #333;
    }

    .sidebar::-webkit-scrollbar-thumb:hover {
      background: #555;
    }

    /* Loading spinner */
    .loading {
      display: inline-block;
      width: 12px;
      height: 12px;
      border: 2px solid #333;
      border-top-color: #fff;
      border-radius: 50%;
      animation: spin 0.6s linear infinite;
      margin-left: 8px;
      vertical-align: middle;
    }

    @keyframes spin {
      to { transform: rotate(360deg); }
    }
  </style>
</head>
<body>

  <div class="sidebar">
    <div class="sidebar-header">
      <h1>Distance Tracker</h1>
      <p>Road &amp; ship travel visualizer</p>
    </div>

    <!-- My Home Section -->
    <div class="section">
      <div class="section-label">My Home</div>
      <div class="input-group">
        <input
          type="text"
          id="homeAddress"
          value="Ramaniyam Gallery, 8A, 18/1, SH 49, Thiruvalluvar Nagar, Thiruvanmiyur, Chennai, Tamil Nadu 600041"
          placeholder="Enter your home address..."
        />
      </div>
      <div class="home-actions">
        <button class="btn-small" id="updateHomeBtn" onclick="geocodeHome()">Update Home</button>
      </div>
      <div class="home-status" id="homeStatus">
        <span class="dot" id="homeDot"></span>
        <span id="homeStatusText">Locating home...</span>
      </div>
    </div>

    <!-- Your Location Section -->
    <div class="section">
      <div class="section-label">Your Location</div>
      <div class="input-group" id="addressInputGroup">
        <input
          type="text"
          id="personAddress"
          placeholder="Type an address to search..."
          autocomplete="off"
        />
        <div class="autocomplete-list" id="autocompleteList" style="display:none;"></div>
      </div>
      <button class="btn-primary" id="addBtn" onclick="addPerson()" disabled>Add</button>
    </div>

    <!-- Journey Section -->
    <div class="section" id="journeySection">
      <div class="section-label">Journey Visualization</div>
      <div id="journeyWaiting" style="color:#555; font-style:italic; font-size:13px;">Add your location above to see the road &amp; ship travel route.</div>
      <div class="journey-stats" id="journeyStats"></div>
      <div class="journey-progress" id="journeyProgress" style="display:none;">
        <div class="progress-bar">
          <div class="progress-fill" id="progressFill"></div>
        </div>
        <div class="segment-indicator" id="segmentIndicator">Preparing route...</div>
      </div>
      <div id="journeyCompleteMsg" style="display:none;"></div>
      <button class="btn-journey" id="startJourneyBtn" onclick="startJourney()" style="display:none;">Start Journey</button>
      <button class="btn-reset" id="resetJourneyBtn" onclick="resetJourney()" style="display:none;">Reset Journey</button>
    </div>

    <!-- Your Location Card -->
    <div id="personCardContainer">
      <div class="empty-state" id="emptyState">
        Enter an address above to see the distance and travel route.
      </div>
    </div>
  </div>

  <div class="map-container">
    <div id="map"></div>
    <div class="map-legend" id="mapLegend" style="display:none;">
      <div class="legend-title">Travel Mode</div>
      <div class="legend-item">
        <span class="legend-line road"></span>
        <span>By Road</span>
      </div>
      <div class="legend-item">
        <span class="legend-line ship"></span>
        <span>By Ship</span>
      </div>
      <div class="legend-item">
        <span class="legend-line port-line"></span>
        <span>Port / Transition</span>
      </div>
    </div>
  </div>

  <script>
    // ─── Land Regions (rough bounding boxes) ──────────────────────────
    const LAND_REGIONS = [
      // North America
      { minLat: 24, maxLat: 50, minLng: -125, maxLng: -66 },
      { minLat: 50, maxLat: 72, minLng: -140, maxLng: -60 },
      { minLat: 54, maxLat: 72, minLng: -170, maxLng: -130 },
      // Mexico & Central America
      { minLat: 14, maxLat: 33, minLng: -118, maxLng: -86 },
      { minLat: 7, maxLat: 18, minLng: -92, maxLng: -77 },
      // South America
      { minLat: -56, maxLat: 12, minLng: -82, maxLng: -35 },
      // Western Europe
      { minLat: 36, maxLat: 60, minLng: -10, maxLng: 25 },
      // Scandinavia & Northern Europe
      { minLat: 55, maxLat: 71, minLng: 5, maxLng: 32 },
      // Eastern Europe
      { minLat: 42, maxLat: 60, minLng: 20, maxLng: 45 },
      // Russia
      { minLat: 50, maxLat: 75, minLng: 30, maxLng: 180 },
      { minLat: 45, maxLat: 70, minLng: 28, maxLng: 60 },
      // North Africa
      { minLat: 18, maxLat: 37, minLng: -18, maxLng: 40 },
      // Sub-Saharan Africa
      { minLat: 4, maxLat: 18, minLng: -18, maxLng: 16 },
      { minLat: -12, maxLat: 18, minLng: 16, maxLng: 52 },
      { minLat: -35, maxLat: 0, minLng: 10, maxLng: 42 },
      // Middle East
      { minLat: 22, maxLat: 42, minLng: 32, maxLng: 60 },
      // Arabian Peninsula
      { minLat: 12, maxLat: 32, minLng: 35, maxLng: 60 },
      // Iran / Afghanistan / Pakistan
      { minLat: 24, maxLat: 40, minLng: 44, maxLng: 75 },
      // Central Asia
      { minLat: 35, maxLat: 55, minLng: 50, maxLng: 90 },
      // Indian Subcontinent
      { minLat: 8, maxLat: 35, minLng: 68, maxLng: 92 },
      // Sri Lanka
      { minLat: 5.9, maxLat: 9.9, minLng: 79.5, maxLng: 82 },
      // China / Mongolia
      { minLat: 18, maxLat: 54, minLng: 73, maxLng: 135 },
      // Southeast Asia (mainland)
      { minLat: 5, maxLat: 28, minLng: 92, maxLng: 109 },
      // Korean Peninsula
      { minLat: 33, maxLat: 43, minLng: 124, maxLng: 131 },
      // Japan
      { minLat: 30, maxLat: 46, minLng: 129, maxLng: 146 },
      // Indonesia / Philippines
      { minLat: -8, maxLat: 6, minLng: 95, maxLng: 141 },
      { minLat: 5, maxLat: 20, minLng: 117, maxLng: 127 },
      // Australia
      { minLat: -44, maxLat: -10, minLng: 112, maxLng: 154 },
      // New Zealand
      { minLat: -47, maxLat: -34, minLng: 166, maxLng: 179 },
    ];

    function isLand(lat, lng) {
      return LAND_REGIONS.some(r =>
        lat >= r.minLat && lat <= r.maxLat &&
        lng >= r.minLng && lng <= r.maxLng
      );
    }

    // ─── State ───────────────────────────────────────────────────────
    let homeCoords = null;
    let homeMarker = null;
    let personData = null;
    let personMarker = null;
    let distanceLine = null;
    let selectedResult = null;
    let debounceTimer = null;

    // Journey state
    let journey = {
      segments: [],
      allPoints: [],
      polylines: [],
      portMarkers: [],
      vehicleMarker: null,
      currentPointIndex: 0,
      isAnimating: false,
      animationTimer: null,
      roadDistance: 0,
      shipDistance: 0,
      isComplete: false,
      precomputedRoute: null,
      totalDist: 0,
      currentSegmentType: 'road'
    };

    // ─── Map Init ────────────────────────────────────────────────────
    const map = L.map('map', {
      zoomControl: true
    }).setView([13.0, 80.25], 12);

    L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
      attribution: '&copy; OpenStreetMap contributors'
    }).addTo(map);

    // ─── Custom Icons ────────────────────────────────────────────────
    function createSVGIcon(label, isHome) {
      const size = isHome ? 36 : 32;
      const svg = isHome
        ? `<svg xmlns="http://www.w3.org/2000/svg" width="${size}" height="${size}" viewBox="0 0 36 36">
            <polygon points="18,4 32,18 27,18 27,32 9,32 9,18 4,18" fill="#000" stroke="#fff" stroke-width="2"/>
            <text x="18" y="25" text-anchor="middle" fill="#fff" font-family="Times New Roman,serif" font-size="9" font-weight="bold">HOME</text>
          </svg>`
        : `<svg xmlns="http://www.w3.org/2000/svg" width="${size}" height="${size}" viewBox="0 0 32 40">
            <path d="M16,2 C9,2 3,8 3,15 C3,24 16,38 16,38 C16,38 29,24 29,15 C29,8 23,2 16,2 Z" fill="#000" stroke="#fff" stroke-width="2"/>
            <text x="16" y="20" text-anchor="middle" fill="#fff" font-family="Times New Roman,serif" font-size="9" font-weight="bold">YOU</text>
          </svg>`;

      return L.divIcon({
        html: svg,
        className: '',
        iconSize: [size, isHome ? size : size + 8],
        iconAnchor: [size / 2, isHome ? size / 2 : size + 8],
        popupAnchor: [0, isHome ? -size / 2 : -(size + 8)]
      });
    }

    // ─── Haversine ───────────────────────────────────────────────────
    function haversineDistance(lat1, lon1, lat2, lon2) {
      const R = 6371;
      const dLat = (lat2 - lat1) * Math.PI / 180;
      const dLon = (lon2 - lon1) * Math.PI / 180;
      const a = Math.sin(dLat / 2) ** 2 +
                Math.cos(lat1 * Math.PI / 180) *
                Math.cos(lat2 * Math.PI / 180) *
                Math.sin(dLon / 2) ** 2;
      const c = 2 * Math.atan2(Math.sqrt(a), Math.sqrt(1 - a));
      return R * c;
    }

    // ─── Great Circle Interpolation ──────────────────────────────────
    function generateGreatCirclePoints(start, end, numPoints) {
      const points = [];
      const lat1 = start.lat * Math.PI / 180;
      const lng1 = start.lng * Math.PI / 180;
      const lat2 = end.lat * Math.PI / 180;
      const lng2 = end.lng * Math.PI / 180;

      const d = 2 * Math.asin(Math.sqrt(
        Math.sin((lat1 - lat2) / 2) ** 2 +
        Math.cos(lat1) * Math.cos(lat2) * Math.sin((lng1 - lng2) / 2) ** 2
      ));

      // Very short distance: use linear interpolation
      if (d < 0.0001) {
        for (let i = 0; i <= numPoints; i++) {
          const f = i / numPoints;
          points.push({
            lat: start.lat + f * (end.lat - start.lat),
            lng: start.lng + f * (end.lng - start.lng)
          });
        }
        return points;
      }

      for (let i = 0; i <= numPoints; i++) {
        const f = i / numPoints;
        const A = Math.sin((1 - f) * d) / Math.sin(d);
        const B = Math.sin(f * d) / Math.sin(d);

        const x = A * Math.cos(lat1) * Math.cos(lng1) + B * Math.cos(lat2) * Math.cos(lng2);
        const y = A * Math.cos(lat1) * Math.sin(lng1) + B * Math.cos(lat2) * Math.sin(lng2);
        const z = A * Math.sin(lat1) + B * Math.sin(lat2);

        const lat = Math.atan2(z, Math.sqrt(x * x + y * y)) * 180 / Math.PI;
        const lng = Math.atan2(y, x) * 180 / Math.PI;

        points.push({ lat, lng });
      }

      return points;
    }

    // ─── Find Nearest Port ───────────────────────────────────────────
    function findNearestPort(coords) {
      let best = null;
      let bestDist = Infinity;
      for (const [id, port] of Object.entries(PORTS)) {
        const d = haversineDistance(coords.lat, coords.lng, port.lat, port.lng);
        if (d < bestDist) {
          bestDist = d;
          best = { id, ...port, dist: d };
        }
      }
      return best;
    }

    // ─── Dijkstra Sea Route ──────────────────────────────────────────
    function dijkstraSeaRoute(fromId, toId) {
      if (fromId === toId) return [fromId];

      // Build adjacency list
      const adj = {};
      Object.keys(PORTS).forEach(id => { adj[id] = []; });

      SHIPPING_EDGES.forEach(edge => {
        const d = haversineDistance(PORTS[edge.from].lat, PORTS[edge.from].lng, PORTS[edge.to].lat, PORTS[edge.to].lng);
        adj[edge.from].push({ to: edge.to, dist: d });
        adj[edge.to].push({ to: edge.from, dist: d });
      });

      const distances = {};
      const prev = {};
      const visited = new Set();
      Object.keys(PORTS).forEach(id => { distances[id] = Infinity; });
      distances[fromId] = 0;

      while (true) {
        let minDist = Infinity;
        let current = null;
        for (const id of Object.keys(PORTS)) {
          if (!visited.has(id) && distances[id] < minDist) {
            minDist = distances[id];
            current = id;
          }
        }
        if (current === null || current === toId) break;
        visited.add(current);

        for (const { to, dist } of adj[current]) {
          const newDist = distances[current] + dist;
          if (newDist < distances[to]) {
            distances[to] = newDist;
            prev[to] = current;
          }
        }
      }

      if (distances[toId] === Infinity) return [fromId, toId];

      const path = [];
      let node = toId;
      while (node) { path.unshift(node); node = prev[node]; }
      return path;
    }

    // ─── Build Shipping Waypoints from Port Path ─────────────────────
    function findShippingEdge(fromId, toId) {
      return SHIPPING_EDGES.find(e =>
        (e.from === fromId && e.to === toId) || (e.from === toId && e.to === fromId)
      );
    }

    function getShippingWaypoints(portPath) {
      if (portPath.length < 2) return [];
      const points = [];

      for (let i = 0; i < portPath.length - 1; i++) {
        const fromPort = PORTS[portPath[i]];
        const toPort = PORTS[portPath[i + 1]];
        const edge = findShippingEdge(portPath[i], portPath[i + 1]);

        let waypoints;
        if (edge && edge.waypoints) {
          // Determine direction: if edge.from matches our from, use waypoints as-is; otherwise reverse
          const reversed = edge.from !== portPath[i];
          const edgeWps = reversed ? [...edge.waypoints].reverse() : edge.waypoints;
          waypoints = [
            { lat: fromPort.lat, lng: fromPort.lng },
            ...edgeWps,
            { lat: toPort.lat, lng: toPort.lng }
          ];
        } else {
          waypoints = [
            { lat: fromPort.lat, lng: fromPort.lng },
            { lat: toPort.lat, lng: toPort.lng }
          ];
        }

        // Generate smooth intermediate points between each waypoint pair
        for (let j = 0; j < waypoints.length - 1; j++) {
          const segPts = generateGreatCirclePoints(waypoints[j], waypoints[j + 1], 20);
          if (points.length > 0) segPts.shift(); // avoid duplicate at junction
          points.push(...segPts);
        }
      }
      return points;
    }

    // ─── OSRM Road Routing ───────────────────────────────────────────
    async function getOSRMRoute(start, end) {
      try {
        const url = `https://router.project-osrm.org/route/v1/driving/${start.lng},${start.lat};${end.lng},${end.lat}?overview=full&geometries=geojson`;
        const controller = new AbortController();
        const timeout = setTimeout(() => controller.abort(), 8000);
        const res = await fetch(url, { signal: controller.signal });
        clearTimeout(timeout);
        const data = await res.json();
        if (data.code === 'Ok' && data.routes && data.routes.length > 0) {
          return data.routes[0].geometry.coordinates.map(c => ({ lat: c[1], lng: c[0] }));
        }
        return null;
      } catch (e) {
        return null;
      }
    }

    // ─── Subsample Points ────────────────────────────────────────────
    function subsamplePoints(points, targetCount) {
      if (!points || points.length <= targetCount) return points || [];
      const result = [points[0]];
      const step = (points.length - 1) / (targetCount - 1);
      for (let i = 1; i < targetCount - 1; i++) {
        result.push(points[Math.round(i * step)]);
      }
      result.push(points[points.length - 1]);
      return result;
    }

    // ─── Normalize Segment Point Density ─────────────────────────────
    function normalizeSegments(segments, targetTotal) {
      let totalDist = 0;
      segments.forEach(seg => {
        let d = 0;
        for (let i = 1; i < seg.points.length; i++) {
          d += haversineDistance(seg.points[i-1].lat, seg.points[i-1].lng, seg.points[i].lat, seg.points[i].lng);
        }
        seg._dist = d;
        totalDist += d;
      });
      if (totalDist === 0) return segments;

      return segments.map(seg => ({
        type: seg.type,
        points: subsamplePoints(seg.points, Math.max(10, Math.round(targetTotal * seg._dist / totalDist)))
      }));
    }

    // ─── Full Route Generation (OSRM + Shipping) ─────────────────────
    async function generateFullRoute(start, end) {
      // 1. Try direct OSRM road route
      const directRoad = await getOSRMRoute(start, end);
      if (directRoad && directRoad.length > 0) {
        return normalizeSegments([{ type: 'road', points: directRoad }], 400);
      }

      // 2. Need ocean crossing — find nearest ports
      const startPort = findNearestPort(start);
      const endPort = findNearestPort(end);

      if (startPort.id === endPort.id) {
        // Same port — fallback to great circle
        const pts = generateGreatCirclePoints(start, end, 300);
        return [{ type: 'road', points: pts }];
      }

      // 3. Road from start to departure port
      const roadToPort = await getOSRMRoute(start, { lat: startPort.lat, lng: startPort.lng });

      // 4. Sea route between ports (Dijkstra + shipping lanes)
      const seaPath = dijkstraSeaRoute(startPort.id, endPort.id);
      const seaPoints = getShippingWaypoints(seaPath);

      // 5. Road from arrival port to destination
      const roadFromPort = await getOSRMRoute({ lat: endPort.lat, lng: endPort.lng }, end);

      // 6. Stitch segments
      const segments = [];

      if (roadToPort && roadToPort.length > 0) {
        segments.push({ type: 'road', points: roadToPort });
      } else {
        segments.push({ type: 'road', points: generateGreatCirclePoints(start, { lat: startPort.lat, lng: startPort.lng }, 50) });
      }

      if (seaPoints.length > 0) {
        segments.push({ type: 'ship', points: seaPoints });
      }

      if (roadFromPort && roadFromPort.length > 0) {
        segments.push({ type: 'road', points: roadFromPort });
      } else {
        segments.push({ type: 'road', points: generateGreatCirclePoints({ lat: endPort.lat, lng: endPort.lng }, end, 50) });
      }

      return normalizeSegments(segments, 400);
    }

    // ─── Calculate Segment Distances ─────────────────────────────────
    function calculateSegmentDistances(segments) {
      let roadDist = 0;
      let shipDist = 0;

      segments.forEach(seg => {
        let dist = 0;
        for (let i = 1; i < seg.points.length; i++) {
          dist += haversineDistance(
            seg.points[i - 1].lat, seg.points[i - 1].lng,
            seg.points[i].lat, seg.points[i].lng
          );
        }
        if (seg.type === 'road') roadDist += dist;
        else shipDist += dist;
      });

      return { roadDist, shipDist, totalDist: roadDist + shipDist };
    }

    // ─── Geocode via Nominatim ───────────────────────────────────────
    async function geocode(address) {
      const url = `https://nominatim.openstreetmap.org/search?format=json&q=${encodeURIComponent(address)}&limit=1`;
      const res = await fetch(url, {
        headers: { 'User-Agent': 'DistanceTrackerApp/1.0' }
      });
      const data = await res.json();
      if (data.length === 0) return null;
      return { lat: parseFloat(data[0].lat), lng: parseFloat(data[0].lon), display: data[0].display_name };
    }

    // ─── Geocode Home ────────────────────────────────────────────────
    async function geocodeHome() {
      const address = document.getElementById('homeAddress').value.trim();
      if (!address) return;

      const statusText = document.getElementById('homeStatusText');
      const dot = document.getElementById('homeDot');
      statusText.textContent = 'Locating home...';
      dot.classList.remove('active');

      const result = await geocode(address);
      if (result) {
        homeCoords = { lat: result.lat, lng: result.lng };

        if (homeMarker) map.removeLayer(homeMarker);
        homeMarker = L.marker([result.lat, result.lng], { icon: createSVGIcon('HOME', true) }).addTo(map);
        homeMarker.bindPopup(`
          <div class="popup-title">Home</div>
          <div class="popup-address">${address}</div>
        `);

        if (!personData) {
          map.setView([result.lat, result.lng], 14);
        }

        statusText.textContent = 'Home located';
        dot.classList.add('active');

        if (personData) {
          updateDistance();
        }
      } else {
        statusText.textContent = 'Address not found';
        dot.classList.remove('active');
      }
    }

    // ─── Autocomplete ────────────────────────────────────────────────
    const personInput = document.getElementById('personAddress');
    const autocompleteList = document.getElementById('autocompleteList');
    const addBtn = document.getElementById('addBtn');

    personInput.addEventListener('input', function () {
      const query = this.value.trim();
      selectedResult = null;
      addBtn.disabled = true;

      if (debounceTimer) clearTimeout(debounceTimer);

      if (query.length < 3) {
        autocompleteList.style.display = 'none';
        return;
      }

      debounceTimer = setTimeout(async () => {
        try {
          const url = `https://nominatim.openstreetmap.org/search?format=json&q=${encodeURIComponent(query)}&limit=5`;
          const res = await fetch(url, {
            headers: { 'User-Agent': 'DistanceTrackerApp/1.0' }
          });
          const data = await res.json();

          if (data.length === 0) {
            autocompleteList.style.display = 'none';
            return;
          }

          autocompleteList.innerHTML = '';
          data.forEach(item => {
            const div = document.createElement('div');
            div.className = 'autocomplete-item';
            div.textContent = item.display_name;
            div.addEventListener('click', () => {
              personInput.value = item.display_name;
              selectedResult = {
                lat: parseFloat(item.lat),
                lng: parseFloat(item.lon),
                display: item.display_name
              };
              autocompleteList.style.display = 'none';
              addBtn.disabled = false;
            });
            autocompleteList.appendChild(div);
          });
          autocompleteList.style.display = 'block';
        } catch (e) {
          autocompleteList.style.display = 'none';
        }
      }, 300);
    });

    document.addEventListener('click', function (e) {
      if (!document.getElementById('addressInputGroup').contains(e.target)) {
        autocompleteList.style.display = 'none';
      }
    });

    // ─── Add Person ──────────────────────────────────────────────────
    function addPerson() {
      if (!selectedResult) return;

      personData = {
        address: selectedResult.display,
        lat: selectedResult.lat,
        lng: selectedResult.lng,
        distance: null
      };

      personInput.value = '';
      selectedResult = null;
      addBtn.disabled = true;

      if (personMarker) map.removeLayer(personMarker);
      personMarker = L.marker([personData.lat, personData.lng], {
        icon: createSVGIcon('YOU', false)
      }).addTo(map);

      updateDistance();
      renderPersonCard();
    }

    // ─── Update Distance ─────────────────────────────────────────────
    function updateDistance() {
      if (!homeCoords || !personData) return;

      const dist = haversineDistance(homeCoords.lat, homeCoords.lng, personData.lat, personData.lng);
      personData.distance = dist;

      if (personMarker) {
        personMarker.bindPopup(`
          <div class="popup-title">You</div>
          <div class="popup-address">${personData.address}</div>
          <div class="popup-distance">${dist.toFixed(2)} km</div>
        `);
      }

      // Draw simple dashed line (will be replaced by journey animation)
      if (distanceLine) map.removeLayer(distanceLine);
      distanceLine = L.polyline(
        [[homeCoords.lat, homeCoords.lng], [personData.lat, personData.lng]],
        { color: '#fff', weight: 1, dashArray: '4, 8', opacity: 0.3 }
      ).addTo(map);

      const group = L.featureGroup([homeMarker, personMarker]);
      map.fitBounds(group.getBounds().pad(0.3));

      renderPersonCard();

      // Compute route then auto-start
      computeAndShowJourney();
    }

    // ─── Compute Route & Show Journey Section ────────────────────────
    async function computeAndShowJourney() {
      if (!homeCoords || !personData) return;

      document.getElementById('journeyWaiting').style.display = 'none';
      document.getElementById('journeyStats').innerHTML = '<div style="color:#888; font-style:italic; font-size:13px;">Computing route via OSRM &amp; shipping lanes...</div>';
      document.getElementById('startJourneyBtn').style.display = 'none';
      document.getElementById('resetJourneyBtn').style.display = 'none';
      document.getElementById('journeyProgress').style.display = 'none';
      document.getElementById('journeyCompleteMsg').style.display = 'none';

      try {
        // Generate full route (async — calls OSRM)
        const segments = await generateFullRoute(homeCoords, personData);
        journey.precomputedRoute = segments;

        const { roadDist, shipDist, totalDist } = calculateSegmentDistances(segments);
        journey.roadDistance = roadDist;
        journey.shipDistance = shipDist;

        const statsHtml = `
          <div class="journey-stat-row">
            <span class="stat-label"><span class="stat-dot road"></span> By Road</span>
            <span class="stat-value">${roadDist.toFixed(1)} km</span>
          </div>
          <div class="journey-stat-row">
            <span class="stat-label"><span class="stat-dot ship"></span> By Ship</span>
            <span class="stat-value">${shipDist.toFixed(1)} km</span>
          </div>
          <div class="journey-stat-row" style="border-top: 1px solid #333; padding-top: 8px; margin-top: 4px;">
            <span class="stat-label"><span class="stat-dot total"></span> Total</span>
            <span class="stat-value">${totalDist.toFixed(1)} km</span>
          </div>
        `;
        document.getElementById('journeyStats').innerHTML = statsHtml;

        document.getElementById('startJourneyBtn').style.display = 'block';
        document.getElementById('startJourneyBtn').disabled = false;
        document.getElementById('startJourneyBtn').textContent = 'Start Journey';

        // Auto-start
        if (!journey.isAnimating && !journey.isComplete) {
          setTimeout(() => startJourney(), 600);
        }
      } catch (err) {
        document.getElementById('journeyStats').innerHTML = '<div style="color:#c66; font-size:13px;">Route computation failed. Try again.</div>';
        document.getElementById('startJourneyBtn').style.display = 'block';
        document.getElementById('startJourneyBtn').disabled = false;
        document.getElementById('startJourneyBtn').textContent = 'Retry';
      }
    }

    // ─── Zoom Level for Distance ────────────────────────────────────
    function getJourneyZoom(totalDistKm, segmentType) {
      let base;
      if (totalDistKm < 50) base = 13;
      else if (totalDistKm < 200) base = 11;
      else if (totalDistKm < 800) base = 9;
      else if (totalDistKm < 3000) base = 7;
      else if (totalDistKm < 8000) base = 5;
      else base = 4;
      // Ship segments zoom out slightly to show the open water
      if (segmentType === 'ship') base = Math.max(3, base - 1);
      return base;
    }

    // ─── Start Journey Animation ─────────────────────────────────────
    function startJourney() {
      if (!homeCoords || !personData) return;
      if (journey.isAnimating) return;

      // Use pre-computed route, or fall back to re-computing
      const segments = journey.precomputedRoute;
      if (!segments || segments.length === 0) {
        computeAndShowJourney();
        return;
      }

      // Clear previous journey visuals
      clearJourneyVisuals();

      // Hide the simple distance line
      if (distanceLine) {
        map.removeLayer(distanceLine);
        distanceLine = null;
      }

      // Flatten all points for animation indexing
      const allPoints = [];
      segments.forEach(seg => allPoints.push(...seg.points));

      // Calculate total distance for zoom decisions
      const totalDist = haversineDistance(homeCoords.lat, homeCoords.lng, personData.lat, personData.lng);

      journey.segments = segments;
      journey.allPoints = allPoints;
      journey.currentPointIndex = 0;
      journey.isAnimating = true;
      journey.isComplete = false;
      journey.totalDist = totalDist;
      journey.currentSegmentType = segments.length > 0 ? segments[0].type : 'road';

      // Create polylines for each segment (initially empty)
      let globalIndex = 0;
      segments.forEach(seg => {
        const color = seg.type === 'road' ? '#D4A843' : '#64B5F6';
        const dashArray = seg.type === 'road' ? null : '8, 6';

        // Shadow line for glow effect
        const shadowLine = L.polyline([], {
          color: color,
          weight: 10,
          opacity: 0.2
        }).addTo(map);

        const polyline = L.polyline([], {
          color: color,
          weight: 4,
          opacity: 0.9,
          dashArray: dashArray,
          lineCap: 'round',
          lineJoin: 'round'
        }).addTo(map);

        seg.startIndex = globalIndex;
        globalIndex += seg.points.length;

        journey.polylines.push({ main: polyline, shadow: shadowLine, type: seg.type });
      });

      // Create vehicle marker
      const startType = segments.length > 0 ? segments[0].type : 'road';
      journey.vehicleMarker = L.marker([allPoints[0].lat, allPoints[0].lng], {
        icon: createVehicleIcon(startType),
        zIndexOffset: 1000
      }).addTo(map);

      // Show legend and progress
      document.getElementById('mapLegend').style.display = 'block';
      document.getElementById('journeyProgress').style.display = 'block';
      document.getElementById('startJourneyBtn').disabled = true;
      document.getElementById('startJourneyBtn').textContent = 'Animating...';

      // Zoom into home location first, then start animating
      const startZoom = getJourneyZoom(totalDist, startType);
      map.flyTo([homeCoords.lat, homeCoords.lng], startZoom, { duration: 1.5 });

      // Wait for fly animation to finish, then begin the path drawing
      setTimeout(() => {
        if (journey.isAnimating) animateStep();
      }, 1800);
    }

    function createVehicleIcon(type) {
      return L.divIcon({
        html: `<div class="vehicle-dot ${type}"></div>`,
        className: '',
        iconSize: [18, 18],
        iconAnchor: [9, 9]
      });
    }

    function createPortIcon() {
      return L.divIcon({
        html: `<div class="port-dot"></div>`,
        className: '',
        iconSize: [12, 12],
        iconAnchor: [6, 6]
      });
    }

    function animateStep() {
      if (!journey.isAnimating) return;
      if (journey.currentPointIndex >= journey.allPoints.length) {
        completeJourney();
        return;
      }

      const point = journey.allPoints[journey.currentPointIndex];
      let currentSegType = journey.currentSegmentType;

      // Find which segment this point belongs to
      let cumulative = 0;
      for (let i = 0; i < journey.segments.length; i++) {
        const seg = journey.segments[i];
        const segEnd = cumulative + seg.points.length;

        if (journey.currentPointIndex < segEnd) {
          const localIndex = journey.currentPointIndex - cumulative;
          currentSegType = seg.type;

          // Add point to polyline
          journey.polylines[i].main.addLatLng([point.lat, point.lng]);
          journey.polylines[i].shadow.addLatLng([point.lat, point.lng]);

          // Segment transition: update icon, add port marker, adjust zoom
          if (localIndex === 0 && i > 0) {
            journey.vehicleMarker.setIcon(createVehicleIcon(seg.type));
            journey.currentSegmentType = seg.type;

            // Add port marker at transition point
            const portMarker = L.marker([point.lat, point.lng], {
              icon: createPortIcon(),
              zIndexOffset: 500
            }).addTo(map);
            portMarker.bindPopup(`
              <div class="popup-title">Port</div>
              <div class="popup-address">Transition: ${journey.segments[i - 1].type} to ${seg.type}</div>
            `);
            journey.portMarkers.push(portMarker);

            // Smoothly adjust zoom for new segment type
            const newZoom = getJourneyZoom(journey.totalDist, seg.type);
            map.flyTo([point.lat, point.lng], newZoom, { duration: 1.0, easeLinearity: 0.5 });
          }

          // Update segment indicator
          const indicator = document.getElementById('segmentIndicator');
          indicator.textContent = seg.type === 'road' ? 'Travelling by road...' : 'Sailing by ship...';
          indicator.className = `segment-indicator ${seg.type}`;

          break;
        }
        cumulative = segEnd;
      }

      // Move vehicle
      journey.vehicleMarker.setLatLng([point.lat, point.lng]);

      // Pan camera to follow the vehicle (no animation, instant tracking)
      map.setView([point.lat, point.lng], map.getZoom(), { animate: false });

      // Update progress bar
      const progress = (journey.currentPointIndex / journey.allPoints.length) * 100;
      document.getElementById('progressFill').style.width = progress + '%';

      journey.currentPointIndex++;

      // Animation speed: ~40ms per frame = ~12 seconds for 300 points
      const baseDelay = 40;
      journey.animationTimer = setTimeout(() => requestAnimationFrame(animateStep), baseDelay);
    }

    function completeJourney() {
      journey.isAnimating = false;
      journey.isComplete = true;

      // Update UI
      document.getElementById('progressFill').style.width = '100%';
      document.getElementById('segmentIndicator').textContent = 'Journey complete';
      document.getElementById('segmentIndicator').className = 'segment-indicator';
      document.getElementById('segmentIndicator').style.color = '#D4A843';

      document.getElementById('startJourneyBtn').style.display = 'none';

      const completeMsg = document.getElementById('journeyCompleteMsg');
      completeMsg.innerHTML = `<div class="journey-complete-msg">Arrived at destination</div>`;
      completeMsg.style.display = 'block';

      document.getElementById('resetJourneyBtn').style.display = 'block';

      // Remove vehicle marker and add arrival effect
      if (journey.vehicleMarker) {
        map.removeLayer(journey.vehicleMarker);
        journey.vehicleMarker = null;
      }

      // Add arrival pulse at destination and zoom in close
      if (personData) {
        const arrivalIcon = L.divIcon({
          html: `<div style="position:relative; width:40px; height:40px;">
                   <div class="arrival-ring"></div>
                   <div class="arrival-ring" style="animation-delay: 0.5s;"></div>
                 </div>`,
          className: '',
          iconSize: [40, 40],
          iconAnchor: [20, 20]
        });

        const arrivalMarker = L.marker([personData.lat, personData.lng], {
          icon: arrivalIcon,
          zIndexOffset: 800
        }).addTo(map);

        journey.portMarkers.push(arrivalMarker);

        // Cinematic zoom into destination
        map.flyTo([personData.lat, personData.lng], 14, { duration: 2.5 });
      }
    }

    // ─── Reset Journey ───────────────────────────────────────────────
    function resetJourney() {
      if (journey.animationTimer) {
        clearTimeout(journey.animationTimer);
      }
      journey.isAnimating = false;

      clearJourneyVisuals();

      // Re-draw simple distance line
      if (homeCoords && personData) {
        distanceLine = L.polyline(
          [[homeCoords.lat, homeCoords.lng], [personData.lat, personData.lng]],
          { color: '#fff', weight: 1, dashArray: '4, 8', opacity: 0.3 }
        ).addTo(map);

        const group = L.featureGroup([homeMarker, personMarker]);
        map.fitBounds(group.getBounds().pad(0.3));
      }

      document.getElementById('mapLegend').style.display = 'none';

      // Show pre-computed stats and start button (route already computed)
      if (journey.precomputedRoute) {
        const { roadDist, shipDist, totalDist } = calculateSegmentDistances(journey.precomputedRoute);
        document.getElementById('journeyStats').innerHTML = `
          <div class="journey-stat-row">
            <span class="stat-label"><span class="stat-dot road"></span> By Road</span>
            <span class="stat-value">${roadDist.toFixed(1)} km</span>
          </div>
          <div class="journey-stat-row">
            <span class="stat-label"><span class="stat-dot ship"></span> By Ship</span>
            <span class="stat-value">${shipDist.toFixed(1)} km</span>
          </div>
          <div class="journey-stat-row" style="border-top: 1px solid #333; padding-top: 8px; margin-top: 4px;">
            <span class="stat-label"><span class="stat-dot total"></span> Total</span>
            <span class="stat-value">${totalDist.toFixed(1)} km</span>
          </div>
        `;
        document.getElementById('startJourneyBtn').style.display = 'block';
        document.getElementById('startJourneyBtn').disabled = false;
        document.getElementById('startJourneyBtn').textContent = 'Replay Journey';
        document.getElementById('resetJourneyBtn').style.display = 'none';
        document.getElementById('journeyProgress').style.display = 'none';
        document.getElementById('journeyCompleteMsg').style.display = 'none';
      }
    }

    function clearJourneyVisuals() {
      journey.polylines.forEach(p => {
        map.removeLayer(p.main);
        map.removeLayer(p.shadow);
      });
      journey.polylines = [];

      journey.portMarkers.forEach(m => map.removeLayer(m));
      journey.portMarkers = [];

      if (journey.vehicleMarker) {
        map.removeLayer(journey.vehicleMarker);
        journey.vehicleMarker = null;
      }

      if (journey.animationTimer) {
        clearTimeout(journey.animationTimer);
        journey.animationTimer = null;
      }

      journey.segments = [];
      journey.allPoints = [];
      journey.currentPointIndex = 0;
      journey.isComplete = false;
    }

    // ─── Render Person Card ──────────────────────────────────────────
    function renderPersonCard() {
      const container = document.getElementById('personCardContainer');

      if (!personData) {
        container.innerHTML = '<div class="empty-state" id="emptyState">Enter an address above to see the distance and travel route.</div>';
        return;
      }

      const distDisplay = personData.distance !== null
        ? `<div class="card-distance">${personData.distance.toFixed(2)} km</div>
           <div class="card-distance-label">Straight-line distance</div>`
        : `<div class="card-distance-label">Calculating...</div>`;

      container.innerHTML = `
        <div class="section">
          <div class="your-location-card">
            <div class="card-header">
              <div>
                <div class="card-name">You</div>
                <div class="card-address">${personData.address}</div>
              </div>
              <button class="btn-small btn-danger" onclick="removePerson()" title="Remove">Remove</button>
            </div>
            ${distDisplay}
          </div>
        </div>
      `;
    }

    // ─── Remove Person ───────────────────────────────────────────────
    function removePerson() {
      // Stop any running animation
      if (journey.animationTimer) clearTimeout(journey.animationTimer);
      journey.isAnimating = false;
      journey.precomputedRoute = null;
      clearJourneyVisuals();

      if (personMarker) map.removeLayer(personMarker);
      if (distanceLine) map.removeLayer(distanceLine);
      personMarker = null;
      distanceLine = null;
      personData = null;
      renderPersonCard();

      // Reset journey section and legend
      document.getElementById('journeyWaiting').style.display = 'block';
      document.getElementById('journeyStats').innerHTML = '';
      document.getElementById('journeyProgress').style.display = 'none';
      document.getElementById('journeyCompleteMsg').style.display = 'none';
      document.getElementById('startJourneyBtn').style.display = 'none';
      document.getElementById('resetJourneyBtn').style.display = 'none';
      document.getElementById('mapLegend').style.display = 'none';

      if (homeCoords) {
        map.setView([homeCoords.lat, homeCoords.lng], 14);
      }
    }

    // ─── Init ────────────────────────────────────────────────────────
    geocodeHome();
  </script>
</body>
